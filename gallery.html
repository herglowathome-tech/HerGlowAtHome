<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Watch real HerGlowAtHome beauty transformations and service videos from Chandigarh, Mohali, Panchkula and Kharar.">
  <title>Our Work Videos | HerGlowAtHome.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#6d28d9;--deep:#3b146f;--violet:#8b5cf6;--lav:#f5f1ff;--ink:#231634;--muted:#70657e;--line:#e8def7;--white:#fff;--shadow:0 20px 55px rgba(74,34,122,.14)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0,#faf8ff 100%);line-height:1.6}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(109,40,217,.09)}.nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px}.monogram{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:"Playfair Display",serif;background:linear-gradient(145deg,var(--purple),#a855f7);box-shadow:0 9px 22px rgba(109,40,217,.25)}.brand em{font-style:normal;color:var(--purple)}.nav-links{display:flex;gap:25px;align-items:center;font-size:14px;font-weight:700}.book{padding:10px 17px;border-radius:999px;background:var(--purple);color:#fff}
    .hero{text-align:center;padding:78px 0 48px;background:radial-gradient(circle at 85% 5%,#eadfff 0,transparent 27%),radial-gradient(circle at 12% 90%,#f0e7ff 0,transparent 25%)}.kicker{color:var(--purple);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero h1{font-family:"Playfair Display",serif;font-size:clamp(42px,7vw,68px);line-height:1.08;margin:12px 0}.hero h1 span{color:var(--purple)}.hero p{max-width:650px;margin:0 auto;color:var(--muted);font-size:17px}
    main{padding:36px 0 90px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.video-card{overflow:hidden;border:1px solid var(--line);border-radius:25px;background:#fff;box-shadow:var(--shadow)}.video-shell{position:relative;aspect-ratio:9/16;background:#170b25}.video-shell video{width:100%;height:100%;display:block;object-fit:cover}.video-info{padding:16px 18px}.video-info h2{font-size:16px;margin:0 0 4px}.video-info p{color:var(--purple);font-size:12px;font-weight:800;margin:0}.empty{grid-column:1/-1;text-align:center;border:1px dashed #cdb8f3;border-radius:26px;padding:55px 22px;background:#fff}.empty-icon{width:68px;height:68px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:var(--lav);color:var(--purple);font-size:27px}.empty h2{font-family:"Playfair Display",serif;font-size:29px;margin:0 0 8px}.empty p{color:var(--muted);margin:0 auto 20px;max-width:520px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 21px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--violet));color:#fff;font-weight:800;font-size:14px}
    footer{background:#20102f;color:#d8cbe6;text-align:center;padding:32px 20px}.footer-brand{color:#fff;font-weight:800}.footer-small{font-size:12px;margin-top:5px}.wa{position:fixed;right:19px;bottom:19px;width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#25d366;color:#fff;font-size:24px;box-shadow:0 12px 30px rgba(37,211,102,.33)}
    @media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.wrap{width:min(100% - 26px,1120px)}.nav-inner{height:68px}.brand{font-size:17px}.monogram{width:38px;height:38px}.nav-links a:not(.book){display:none}.hero{padding:54px 0 34px}.hero p{font-size:15px}.gallery{grid-template-columns:1fr;gap:20px}.video-card{max-width:440px;width:100%;margin:auto}main{padding-top:25px}.empty{padding:42px 18px}}
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap nav-inner"><a class="brand" href="index.html"><span class="monogram">HG</span><span>Her<em>Glow</em>AtHome</span></a><div class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a class="book" href="services.html#booking">Book Now</a></div></div></nav>
  <header class="hero"><div class="wrap"><div class="kicker">Real services · Real results</div><h1>Our <span>Work</span></h1><p>Watch our latest beauty, hair and self-care work delivered at clients’ homes.</p></div></header>
  <main class="wrap"><div class="gallery" id="gallery"></div></main>
  <footer><div class="footer-brand">HerGlowAtHome.com · You Glow, We Go.</div><div class="footer-small">Ladies-only home salon · Chandigarh • Mohali • Panchkula • Kharar</div></footer>
  <a class="wa" href="https://wa.me/917087128778?text=Hello%20HerGlowAtHome%2C%20I%20would%20like%20to%20book%20a%20service." target="_blank" rel="noopener" aria-label="Chat on WhatsApp">✆</a>
  <script src="work-videos.js"></script>
  <script>
    const gallery=document.getElementById("gallery");
    const videos=Array.isArray(window.HERGLOW_WORK_VIDEOS)?window.HERGLOW_WORK_VIDEOS:[];
    if(!videos.length){
      gallery.innerHTML='<section class="empty"><div class="empty-icon">▶</div><h2>Fresh work coming soon</h2><p>Follow HerGlowAtHome on Instagram to see our latest client transformations and beauty work.</p><a class="btn" href="https://www.instagram.com/herglowathome/" target="_blank" rel="noopener">View Instagram</a></section>';
    }else{
      videos.forEach((item,index)=>{
        const card=document.createElement("article");card.className="video-card";
        const shell=document.createElement("div");shell.className="video-shell";
        const video=document.createElement("video");video.controls=true;video.preload="metadata";video.playsInline=true;video.setAttribute("aria-label",item.title||("HerGlow work video "+(index+1)));
        if(item.poster)video.poster=item.poster;
        const source=document.createElement("source");source.src=item.file;source.type=item.type||"video/mp4";video.appendChild(source);shell.appendChild(video);
        const info=document.createElement("div");info.className="video-info";
        const title=document.createElement("h2");title.textContent=item.title||"HerGlowAtHome Work";
        const service=document.createElement("p");service.textContent=item.service||"Beauty at your doorstep";
        info.append(title,service);card.append(shell,info);gallery.appendChild(card);
      });
    }
  </script>
</body>
</html>
